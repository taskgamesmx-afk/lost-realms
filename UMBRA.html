    stellaBody.addEventListener('collide', function(event) {

            normal = normal.scale(-1);
        }

    }

    });

    window.addEventListener('keyup', function(event) {
        keys[event.code] = false;
    });

    const acelerar = 15;
    const desacelerar = 10;

    let currentSpeed = 0;
    let puedeSaltar = false;
    const saltoF = 150;

    // ANIMACION DE MOVIMIENTO
    function animate() {
        var forward = new THREE.Vector3(0, 0, -1);

        personajeJugador.getWorldDirection(forward);
        forward.normalize();

        // CAMINAR HACIA ADELANTE
        if (keys['KeyW']) {
            currentSpeed = Math.min(currentSpeed + acelerar, moveSpeed);

            piernas1.rotation.x = Math.cos(reloj.getElapsedTime() * (velocidad * 3)) * amplitud;

            piernas2.rotation.x = Math.cos(reloj.getElapsedTime() * (velocidad * 3)) * -amplitud;
        }

        // CAMINAR HACIA ATRÁS
        else if (keys['KeyS']) {
            currentSpeed = Math.max(currentSpeed - acelerar, -moveSpeed);

            piernas1.rotation.x = Math.cos(reloj.getElapsedTime() * (velocidad * 3)) * -amplitud;

            piernas2.rotation.x = Math.cos(reloj.getElapsedTime() * (velocidad * 3)) * amplitud;
        }

        // DETENER ANIMACIÓN DE LAS PIERNAS
        else {
            piernas1.rotation.x = 0;
            piernas2.rotation.x = 0;

            if (currentSpeed > 0) {
                currentSpeed = Math.max(currentSpeed - desacelerar, 0);
            } else if (currentSpeed < 0) {
                currentSpeed = Math.min(currentSpeed + desacelerar, 0);
            }
        }

        // MOVIMIENTO FÍSICO
        stellaBody.velocity.set(
            forward.x * currentSpeed,
            stellaBody.velocity.y,
            forward.z * currentSpeed
        );

        // GIRAR
        if (keys['KeyA']) {
            stellaBody.angularVelocity.y = rotar;
        } else if (keys['KeyD']) {
            stellaBody.angularVelocity.y = -rotar;
        } else {
            stellaBody.angularVelocity.y = 0;
        }

        // SALTAR CON ESPACIO
        if (keys['Space'] && puedeSaltar) {
            stellaBody.velocity.y = saltoF;
            puedeSaltar = false;
        }

        stellaBody.angularVelocity.x = 0;
        stellaBody.angularVelocity.z = 0;

        stellaBody.quaternion.x = 0;
        stellaBody.quaternion.z = 0;

        // ACTUALIZAR POSICIÓN DEL PERSONAJE
        personajeJugador.position.copy(stellaBody.position);
        personajeJugador.quaternion.copy(stellaBody.quaternion);

        //cannonDebug.update();
    }

    function crearColisionRoca(roca) {

        // Obtener las dimensiones de la roca
        var radio = Math.max(
            roca.geometry.parameters.radiusTop,
            roca.geometry.parameters.radiusBottom
        );

        var escalaHorizontal = Math.max(
            roca.scale.x,
            roca.scale.z
        );

        var radioFinal = radio * escalaHorizontal;
        var alturaFinal = roca.geometry.parameters.height * roca.scale.y;

        // Crear cilindro de colisión
        var formaRoca = new CANNON.Cylinder(
            radioFinal,
            radioFinal,
            alturaFinal,
            8
        );

        // Crear cuerpo físico
        var cuerpoRoca = new CANNON.Body({
            mass: 0,
            type: CANNON.Body.STATIC,
            position: new CANNON.Vec3(
                roca.position.x,
                roca.position.y,
                roca.position.z
            )
        });

        cuerpoRoca.addShape(formaRoca);

        world.addBody(cuerpoRoca);
    }

    function crearColisionGrupoRocas(grupo) {

        var escalaX = grupo.scale.x;
        var escalaY = grupo.scale.y;
        var escalaZ = grupo.scale.z;

        // Crear un cilindro que cubra las tres rocas
        var formaRocas = new CANNON.Cylinder(
            190 * Math.max(escalaX, escalaZ),
            190 * Math.max(escalaX, escalaZ),
            180 * escalaY,
            8
        );

        // Crear cuerpo físico
        var cuerpoRocas = new CANNON.Body({
            mass: 0,
            type: CANNON.Body.STATIC,
            position: new CANNON.Vec3(
                grupo.position.x - (500 * escalaX),
                grupo.position.y + (90 * escalaY),
                grupo.position.z
            )
        });

        cuerpoRocas.addShape(formaRocas);

        world.addBody(cuerpoRocas);
    }

            obstacle.geometry.parameters.width / 2,
            obstacle.geometry.parameters.height / 2,
            obstacle.geometry.parameters.depth / 2));

            const obstacleBody = new CANNON.Body({ mass: 0 }); 
            obstacleBody.addShape(obstacleShape);
            obstacleBody.position.copy(obstacle.position);

            const quat = new CANNON.Quaternion();
            quat.setFromEuler( obstacle.rotation.x, obstacle.rotation.y,
            obstacle.rotation.z, "XYZ");
            obstacleBody.quaternion.set(quat.x, quat.y, quat.z,quat.w);
            world.addBody(obstacleBody);
        });

    // Detectar la distancia horizontal entre el personaje y un objeto
    function distanciaObjeto(objeto) {
        var diferenciaX = personajeJugador.position.x - objeto.position.x;
        var diferenciaZ = personajeJugador.position.z - objeto.position.z;

        return Math.sqrt(
            diferenciaX * diferenciaX +
            diferenciaZ * diferenciaZ
        );
    }

    // Buscar un objeto cercano
    function detectarObjetoCercano() {
        objetoCercano = null;
        var distanciaMenor = 250;

        if (!craneoEncontrado && distanciaObjeto(craneoF) < distanciaMenor) {
            objetoCercano = craneoF;
            distanciaMenor = distanciaObjeto(craneoF);
        }

        if (!fuegoEncontrado && distanciaObjeto(fuegoF) < distanciaMenor) {
            objetoCercano = fuegoF;
            distanciaMenor = distanciaObjeto(fuegoF);
        }

        if (!espadaEncontrada && distanciaObjeto(espadaF) < distanciaMenor) {
            objetoCercano = espadaF;
            distanciaMenor = distanciaObjeto(espadaF);
        }

        if (!escudoEncontrado && distanciaObjeto(escudoF) < distanciaMenor) {
            objetoCercano = escudoF;
            distanciaMenor = distanciaObjeto(escudoF);
        }

        if (!cuerdaEncontrada && distanciaObjeto(cuerdaF) < distanciaMenor) {
            objetoCercano = cuerdaF;
            distanciaMenor = distanciaObjeto(cuerdaF);
        }

        if (objetoCercano !== null) {
            mensajeHTML.textContent = "Presiona E para recoger el objeto";
        } else if (objetosRecolectados < 5) {
            mensajeHTML.textContent = "Busca los objetos de UMBRA";
        }
    }

    // Recoger el objeto que está más cerca
    function recogerObjeto() {

        if (objetoCercano === null) {
            return;
        }

        if (objetoCercano === craneoF) {
            craneoEncontrado = true;
        }

        if (objetoCercano === fuegoF) {
            fuegoEncontrado = true;
        }

        if (objetoCercano === espadaF) {
            espadaEncontrada = true;
        }

        if (objetoCercano === escudoF) {
            escudoEncontrado = true;
        }

        if (objetoCercano === cuerdaF) {
            cuerdaEncontrada = true;
        }

        objetoCercano.visible = false;

        objetosRecolectados++;

        contadorHTML.innerHTML =
            "Objetos encontrados: " + objetosRecolectados + " / 5" +
            "<br><span id='mensajeObjeto'></span>";

        
        mensajeHTML = document.getElementById("mensajeObjeto");

        if (objetosRecolectados === 5) {
            mensajeHTML.textContent =
                "¡Encontraste todos los objetos de UMBRA! Ve al portal.";
        } else {
            mensajeHTML.textContent = "¡Objeto encontrado!";
        }

        objetoCercano = null;
    }

    // Recoger al presionar E
    document.addEventListener("keydown", function(event) {

        if (event.key.toLowerCase() === "e" && !event.repeat) {
            recogerObjeto();
        }

    });

    
    // COMPROBAR SI EL PERSONAJE LLEGO AL PORTAL
    function comprobarPortal() {

        // Comprobar si el personaje esta cerca del portal
        if (
            Math.abs(personajeJugador.position.x - 2600) < 120 &&
            personajeJugador.position.z >= -510 &&
            personajeJugador.position.z <= 380
        ) {

            // Verificar si encontro los cinco objetos
            if (objetosRecolectados === 5 && cambioDeMundo == false) {

                cambioDeMundo = true;

                mensajeHTML.textContent = "¡Portal activado! Viajando a IGNIS...";

                window.location.href = "IGNIS.html";

            } else if (objetosRecolectados < 5 && objetoCercano === null) {

                mensajeHTML.textContent =
                    "Encuentra los 5 objetos para activar el portal.";

            }
        }
    }


    
    function seguirPersonaje() {
        var posicionCamara = new THREE.Vector3(0,500,-400);

        posicionCamara.applyQuaternion(personajeJugador.quaternion);
        posicionCamara.add(personajeJugador.position);

        camera.position.lerp(posicionCamara, 0.12);

        camera.lookAt(
            personajeJugador.position.x,
            personajeJugador.position.y + 45,
            personajeJugador.position.z
        );
    }

   


//🎰🎰Rendering y animación
    requestAnimationFrame(render);
    function render() {
        animate();
        world.step(1 / 60);// Actualizar el mundo fisico
        FisicasAlGrafico();// Sincronizar el personaje
        seguirPersonaje();
        detectarObjetoCercano();// Detectar objetos cercanos

    //controls.update();

        //Llamado para renderizar y volver a llamar a la misma función (render)
        renderer.render(scene, camera);
        requestAnimationFrame(render);
    }
