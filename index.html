<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <title>LOST REALMS</title>
    <link rel="icon" href="./assets/logo.png">

    <style>
        /* CONFIGURACION GENERAL */
        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            overflow-x: hidden;
            color: white;
        }

        /* CANVAS PARA THREE.JS */
        #myCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* INTERFAZ PRINCIPAL */
        #interfaz {
            position: relative;
            z-index: 1;

            width: 100%;
            min-height: 100vh;
            min-height: 100svh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;

            gap: clamp(10px, 2vh, 22px);

            padding: 20px 20px clamp(25px, 5vh, 60px);

            background-image: url("./assets/CANVAS.png");
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
        }

        /* BOTON JUGAR */
        .btnjugar {
            margin: 0;
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .btnjugar img {
            display: block;
            width: clamp(160px, 18vw, 250px);
            height: auto;
            object-fit: contain;
            transition: transform 0.3s, filter 0.3s;
        }

        /* CONTENEDOR DE LOS BOTONES */
        .contenedor-botones {
            display: flex;
            justify-content: center;
            align-items: center;

            gap: clamp(10px, 2vw, 25px);

            width: 100%;
            max-width: 850px;
            margin: 0 auto;
        }

        /* BOTONES SECUNDARIOS */
        .btnpersonaje img,
        .btnhistoria img,
        .btninstrucciones img {
            display: block;

            width: clamp(110px, 15vw, 200px);
            height: auto;

            object-fit: contain;

            transition: transform 0.3s, filter 0.3s;
        }

        /* EFECTO AL PASAR EL MOUSE */
        .btnjugar img:hover,
        .btnpersonaje img:hover,
        .btnhistoria img:hover,
        .btninstrucciones img:hover {
            transform: scale(1.08);
            filter: drop-shadow(0 0 15px #bd75ff);
        }

        /* TABLETS Y PANTALLAS PEQUEÑAS */
        @media (max-width: 768px) {

            #interfaz {
                padding-left: 12px;
                padding-right: 12px;
                padding-bottom: 25px;
            }

            .contenedor-botones {
                gap: 10px;
            }

            .btnpersonaje img,
            .btnhistoria img,
            .btninstrucciones img {
                width: clamp(95px, 25vw, 165px);
            }

            .btnjugar img {
                width: clamp(150px, 35vw, 210px);
            }
        }

        /* PANTALLAS CON POCA ALTURA */
        @media (max-height: 650px) {

            #interfaz {
                padding-bottom: 15px;
                gap: 5px;
            }

            .btnjugar img {
                width: clamp(130px, 15vw, 190px);
            }

            .btnpersonaje img,
            .btnhistoria img,
            .btninstrucciones img {
                width: clamp(100px, 12vw, 160px);
            }
        }

    </style>

</head>

<body>
    
<canvas id="myCanvas">
    <!--El elemento HTML canvas se puede utilizar para dibujar gráficos a través de 
        secuencias de comandos (por lo general JavaScript ).-->
</canvas>

    <div id="interfaz">
        <div class="btnjugar">
            <a href="UMBRA.html" id="btnJugar">
                <img src="./assets/boton-jugar.png" alt="Jugar">
            </a>
        </div>

        <div class="contenedor-botones">
            <div class="btnpersonaje">
                <a href="Seleccion_Personajes.html">
                    <img src="./assets/boton-personaje.png">
                </a>
            </div>

            <div class="btnhistoria">
                <a href="historia.html">
                    <img src="./assets/boton-historia.png">
                </a>
            </div>

            <div class="btninstrucciones">
                <a href="Instrucciones.html">
                    <img src="./assets/boton-instrucciones.png">
                </a>
            </div>

        </div>

    </div>

<!-- Aquí va todo el código de three.js -->
<!-- script type="importmap" importa las librerías necesarias para three.js-->
<script type="importmap"> 
    {
        "imports":{
            "three": "./js/three.module.js",
            "three/OrbitControls": "./js/OrbitControls.js" 
        }
}
</script>

<script type="module"> 
//🗃️🗃️ Mandar llamar a la librería
    import * as THREE from 'three'; 
    import {OrbitControls} from 'three/OrbitControls';
    console.log(OrbitControls);
    import {RoundedBoxGeometry} from "./js/RoundedBoxGeometry.js"

//🕹️🕹️ Renderer - Realiza una conexión entre el código y el canvas
    var renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById('myCanvas'), antialias: true,
    });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x70707C);


// 🎬 Creando nueva escena - Es el espacio donde se colocan los objetos
    var scene = new THREE.Scene();

//🎥🎥 Agregar una cámara de perspectiva
    var camera = new THREE.PerspectiveCamera(70,window.innerWidth / window.innerHeight,0.1,2000
      );
    scene.add(camera);

    //Settings de la cámara
    camera.position.set(0, 4, 25);

    // Añadiendo los OrbitControls
    var controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

 

// Espacio para colocar los objetos

///  💫 LUCES



//🎰🎰Rendering y animación
    requestAnimationFrame(render);
    function render() {
    //🪄🪄 Animación - 





    //🎮🎮Actualización del OrbitControls para generar la suavidad de movimiento
    controls.update();
    //Llamado para renderizar y volver a llamar a la misma función (render)
    renderer.render(scene, camera);
    requestAnimationFrame(render);
    }
</script>

    <!-- Código para el botón Jugar -->
    <script>
        
        var botonJugar = document.getElementById("btnJugar");

        botonJugar.addEventListener("click", function(event) {
            event.preventDefault();

            var personaje = localStorage.getItem("personajeSeleccionado");

            if (personaje === null || personaje === "") {
                // Si no hay personaje seleccionado, ir a selección
                window.location.href = "Seleccion_Personajes.html";
            } else {
                // Si ya hay personaje seleccionado, comenzar en UMBRA
                window.location.href = "UMBRA.html";
            }
        });

    </script>


    <audio id="musicaFondo" autoplay loop preload="auto">
        <source src="./audios/inicio_juego.mp3" type="audio/mpeg">
    </audio>

    <script>
        var musica = document.getElementById("musicaFondo");
        musica.volume = 0.25;

        // Intentar reproducir automáticamente
        musica.play().catch(function() {
            // Si el navegador lo bloquea, iniciar con el primer clic
            document.addEventListener("click", function() {
                musica.play();
            }, { once: true });
        });
    </script>


</body>
</html>
